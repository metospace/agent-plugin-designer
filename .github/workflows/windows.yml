name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged app and persistence after restart
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Studio-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
